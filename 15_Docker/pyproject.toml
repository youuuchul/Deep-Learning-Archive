[project]
name = "mission15-docker-workflow"
version = "0.1.0"
description = "Two-researcher Docker workflow for EDA/modeling and inference"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==2.1.3",
  "pandas==2.2.3",
  "plotly==6.0.1",
  "scikit-learn==1.6.1",
  "jupyterlab==4.4.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
